name: Build Android APK (arm64)

# 推到 GitHub 后自动构建；也可以在 Actions 页面手动点 "Run workflow" 触发。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⚠️ 必须显式切到 JDK 17。
      # 光 apt 装 openjdk-17-jdk 是不够的：runner 默认的 JAVA_HOME 仍指向 Java 11，
      # 于是最后 Gradle 打包阶段会失败：
      #   Failed to apply plugin 'com.android.internal.application'.
      #   > Android Gradle plugin requires Java 17 to run. You are currently using Java 11.
      # setup-java 会正确设置 JAVA_HOME 并把 java 放进 PATH。
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      # 缓存 Android SDK / NDK，后续构建能省 20 分钟以上
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # 离线 AI 角色分析：交叉编译 llama.cpp（v0.5.0）产出 llama-cli，
      # 改名 libllama-runner.so 随 APK 打包（Android 只解压 lib*.so，
      # 运行时从 nativeLibraryDir 以独立子进程执行，崩溃不影响主应用）。
      - name: Build llama.cpp runner (arm64)
        run: |
          set -e
          LLAMA_TAG=v0.5.0
          curl -fL --retry 5 -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          mkdir -p /tmp/ndk && unzip -q /tmp/ndk.zip -d /tmp/ndk
          NDK_DIR=$(find /tmp/ndk -maxdepth 1 -type d -name "android-ndk-*" | head -1)
          echo "NDK: $NDK_DIR"
          rm -rf /tmp/llama
          git clone --depth 1 --branch $LLAMA_TAG https://github.com/ggml-org/llama.cpp /tmp/llama
          # ⚠️ BUILD_SHARED_LIBS=OFF：静态链接出单一自包含二进制。
          #    动态构建的 llama-cli 依赖 libllama.so/libggml*.so，安卓对
          #    App 子进程的链接器不搜索 nativeLibraryDir → 启动即报
          #    CANNOT LINK EXECUTABLE（退出码1）
          # ⚠️ v0.5.0 里 tools/cli 只在 LLAMA_BUILD_SERVER=ON 时才进构建
          #    （tools/CMakeLists.txt：if (LLAMA_BUILD_SERVER) add_subdirectory(cli)），
          #    关掉 server 会连带 cli 一起消失 → "No rule to make target llama-cli"
          cmake -S /tmp/llama -B /tmp/llama/build-android \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_DIR/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=ON
          cmake --build /tmp/llama/build-android --target llama-cli -j4
          mkdir -p libs/arm64-v8a
          cp /tmp/llama/build-android/bin/llama-cli libs/arm64-v8a/libllama-runner.so
          # 双保险：即使静态链接未生效（出现 libllama-cli-impl.so 等
          # 依赖库），也把全部依赖 .so 一起打包——App 进程的
          # LD_LIBRARY_PATH 含 nativeLibraryDir，兄弟库可被链接器找到
          cp /tmp/llama/build-android/bin/*.so libs/arm64-v8a/ 2>/dev/null || true
          ls -la libs/arm64-v8a/
          test -f libs/arm64-v8a/libllama-runner.so

      # 本地 TTS（sherpa-onnx v1.11.3 的 C API .so）：下载官方安卓预编译库
      # 到 libs/，随 APK 打包；运行时 ctypes 调 VITS 分支合成（完全离线）。
      - name: Download sherpa-onnx Android libs
        run: |
          mkdir -p libs/arm64-v8a
          curl -fL --retry 5 -o /tmp/sherpa-android.tar.bz2             "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.11.3/sherpa-onnx-v1.11.3-android.tar.bz2"
          rm -rf /tmp/sherpa-extract && mkdir -p /tmp/sherpa-extract
          tar -xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa-extract
          SRC_DIR=$(find /tmp/sherpa-extract -type d -name arm64-v8a | head -1)
          echo "so dir: $SRC_DIR"
          cp "$SRC_DIR"/*.so libs/arm64-v8a/
          ls -la libs/arm64-v8a
          test -f libs/arm64-v8a/libsherpa-onnx-c-api.so

      # 把本次构建的 commit 短哈希写进 build_info.py，随 APK 一起打包。
      # 这样 App 里能直接看到「装的是哪一版」，不用靠猜。
      - name: Write build info
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u '+%m-%d %H:%M')
          printf "SHORT = '%s'\nDATE = '%s'\n" "$SHORT" "$DATE" > build_info.py
          cat build_info.py

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      # 失败时把真正的报错单独打出来。
      # buildozer 的完整日志有几十万行，GitHub 网页端会截断，根本看不到根因；
      # 这一步只输出「命中的错误行 + 最后 60 行」，很短、不会被截断。
      - name: Show build errors (on failure)
        if: failure()
        run: |
          echo "==================== 命中的错误行 ===================="
          grep -nE "ERROR:|error:|Traceback|No matching distribution|not a supported wheel|ErrorReturnCode|FAILED:|No space left|What went wrong|gradlew failed|requires Java|Execution failed|Could not find a version" buildozer.log | tail -40 || true
          echo
          echo "==================== 日志最后 60 行 ===================="
          tail -60 buildozer.log || true

      - name: Show output
        run: ls -lh bin/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiobookreader-arm64-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
