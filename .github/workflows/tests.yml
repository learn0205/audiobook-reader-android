name: Regression tests

# 打包前先跑桌面回归测试：布局贴合 / Edge 推进逻辑 / 配置备份。
# 「桌面过了设备坏了」的教训太多次 —— 至少把能在桌面验证的部分拦在打包之前。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kivy (headless via xvfb)
        run: |
          python -m pip install --upgrade pip
          python -m pip install kivy pillow

      - name: Run regression suite
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a python _run_tests.py
